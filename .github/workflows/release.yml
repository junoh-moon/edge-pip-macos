name: Publish macOS and Edge packages
on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Resources/**'
      - 'extension/**'
      - 'scripts/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build and verify both packages
        run: python3 scripts/package-release.py
      - name: Publish both files in one release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/publish-release.sh
